<!doctype html>
<html><head><meta charset="utf-8"><title>Pardarshi logo</title>
<style>
@font-face { font-family: Fraunces; font-weight: 500 700; src: url(../../web/fonts/Fraunces-normal-6NU78FyL.woff2) format("woff2"); }
@font-face { font-family: Fraunces; font-style: italic; font-weight: 500 600; src: url(../../web/fonts/Fraunces-italic-6NU58FyL.woff2) format("woff2"); }
@font-face { font-family: "Noto Serif Devanagari"; src: url(../../web/fonts/NotoSerifDevanagari-normal-x3dYcl3I.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; src: url(../../web/fonts/IBMPlexMono-normal--F63fjpt.woff2) format("woff2"); }
body { margin: 0; font-family: Fraunces, serif; }
.row { display: flex; gap: 48px; align-items: center; padding: 40px 48px; }
.light { background: #f3eee3; color: #15171f; }
.dark { background: #12110e; color: #f2ecdf; }
.lockup { display: flex; align-items: center; gap: 16px; }
.lockup .t { display: grid; line-height: 1; }
.lockup b { font-weight: 640; font-size: 40px; letter-spacing: -0.02em; }
.lockup .d { font-family: "Noto Serif Devanagari", serif; font-size: 17px; margin-top: 6px; opacity: .78; }
.lockup .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-top: 8px; color: #b8860b; }
.dark .lockup .tag { color: #f0b429; }
.dark .mk rect { fill: #3a4ab8; }
</style></head><body>
<div class="row light" id="lockup-light">
  <div class="lockup"><svg class="mk" width="72" height="72" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#27358f"/><circle cx="34" cy="26" r="12" fill="#fff" fill-opacity=".10"/><path d="M28.5 22.5 H39.5" stroke="#fff" stroke-opacity=".62" stroke-width="2.4" stroke-linecap="round"/><path d="M28.5 28.5 H36" stroke="#f0b429" stroke-width="3.2" stroke-linecap="round"/><circle cx="34" cy="26" r="12" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 26 V50" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>
    <div class="t"><b>Pardarshi</b><span class="d" lang="hi">पारदर्शी</span><span class="tag">See the real price</span></div></div>
</div>
<div class="row dark" id="lockup-dark">
  <div class="lockup"><svg class="mk" width="72" height="72" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#27358f"/><circle cx="34" cy="26" r="12" fill="#fff" fill-opacity=".10"/><path d="M28.5 22.5 H39.5" stroke="#fff" stroke-opacity=".62" stroke-width="2.4" stroke-linecap="round"/><path d="M28.5 28.5 H36" stroke="#f0b429" stroke-width="3.2" stroke-linecap="round"/><circle cx="34" cy="26" r="12" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 26 V50" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>
    <div class="t"><b>Pardarshi</b><span class="d" lang="hi">पारदर्शी</span><span class="tag">See the real price</span></div></div>
</div>
<div class="row light" id="sizes">
  <img src="pardarshi-mark.svg" width="256" height="256" alt="">
  <img src="pardarshi-mark.svg" width="64" height="64" alt="">
  <img src="pardarshi-mark.svg" width="32" height="32" alt="">
  <img src="pardarshi-mark.svg" width="16" height="16" alt="">
</div>
</body></html>
